name: tests

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # `[dev]` = server extras + pytest/ruff/httpx/nibabel: the SDK closure plus
      # what the unit suite drives. onnx is the packaging tool's dependency --
      # installed so the deploy_model gates actually run instead of skipping.
      - run: pip install -e ".[dev]" onnx pynrrd
      - run: ruff check medos/medos tests
      # tests/unit holds every unit gate; the trainer-dependent ones skip
      # themselves when the trainer tree is absent (this split's case).
      - name: pytest tests/unit -q
        run: pytest tests/unit -q
        env:
          # Import resolution on a split checkout: the repo root's product
          # directory (medos/) otherwise shadows the package (medos/medos/)
          # as a namespace package on some editable-install shapes. The
          # explicit path entry pins the real package, matching the monorepo.
          PYTHONPATH: ${{ github.workspace }}/medos
