# =====================================================================================
# MedicalOS test suite.
#
# THE POINT OF THIS FILE IS THE `--require-stack` FLAG ON THE PYTEST LINE.
#
# Twice on this project a run reported green while the system was broken: 74 of 95
# integration tests skipped on a Postgres port that no longer existed, and all 17 e2e
# tests skipped on `medos-api -> HTTP 503`. Both runs exited 0. Without `--require-stack`
# this workflow would do the same: bring up a stack that does not work, watch every test
# that touches it skip, and report success.
#
# With the flag, an unreachable dependency is a FAILURE that names the dependency and the
# command that starts it. See tests/_support/skips.py and tests/README.md.
#
# AND THE FLAG ALONE IS NOT ENOUGH, WHICH IS WHY THE PROBE STEP BELOW IS NOT OPTIONAL.
# `--require-stack` originally only converted a skip into a failure, so it could not see a
# dependency no test reached for. An adversarial pass stopped medos-gateway (the worker's
# ONLY route to DICOM), medos-worker, ohif, minio, triton and the tritond, and
# `pytest ... --require-stack` still printed `233 passed`, exit 0, `INFRA SKIPS: 0`.
# `tests/_support/stack.py` now probes what the selected suites declare, and the e2e
# suite declares the deployment -- so this workflow goes red on that state instead.
#
# `--require-corpus` is deliberately NOT set here. The LCTSC/TCIA corpus is private and is
# not on a GitHub runner; absent private data is not a broken system. The nightly job at
# the bottom is where that switch belongs, because that runner has the corpus mounted.
#
# THAT BLOCKER IS CLOSED (register entry 70), AND HERE IS WHAT IT WAS
#   `medos/deploy/compose/docker-compose.yml` used to publish `127.0.0.1:8042` for orthanc so
#   the host-side acceptance checks could reach it, but orthanc joins ONLY the `pacs`
#   network and that network is `internal: true`. Docker silently drops a host port
#   binding for a container whose only network is internal -- `docker inspect` shows the
#   binding in HostConfig.PortBindings and an empty NetworkSettings.Ports. So Orthanc was
#   unreachable from the host and 29 tests skipped on it permanently.
#
#   Resolved WITHOUT weakening MOS-DATA-006: the `ports:` block is deleted, DICOMweb goes
#   through medos-gateway with a bearer (the route medos-worker and tests/gate/ already
#   used), and Orthanc's native REST API -- which fixture teardown needs and DICOMweb has
#   no DELETE verb for -- is driven from INSIDE the orthanc container over its own
#   loopback. `pacs` stays `internal: true` and orthanc stays on one network.
# =====================================================================================
name: tests

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 03:17 UTC nightly, for the corpus job below.
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------------------
  # Unit tests only. No stack, so `--require-stack` is still correct: a unit test that
  # reaches for a container is a unit test in the wrong directory, and this job proves it
  # by refusing to skip.
  # -----------------------------------------------------------------------------------
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # `medos/medos`, not `medos`: the target is the PACKAGE. `medos/tools`, `medos/services`
      # and `medos/examples` moved under `medos/` when it became a product directory and have
      # never been linted -- 359 findings on the day they arrived. Widening the target is a
      # decision with a diff, not a side effect of a rename.
      #
      # The SDK needs no separate lint word any more: `medos/medos` covers
      # `medos/medos/sdk/` the way it covers everything else in the package. It used to be
      # a distinct top-level package (`medicalos_preprocessing`), linted under its own
      # name until MOS-IMG-003's package was built and then named explicitly here; it has
      # since moved INSIDE the distribution as `medos.sdk`.
      #
      # `viewer` IS IN THE TARGET NOW. The step below runs `pytest viewer/tests`, so CI
      # was already testing a tree it was not linting -- and `viewer/tests/` is 217 tests
      # of executable architecture rules, not incidental code. It cost 36 findings to
      # bring in, all of them line length bar one empty `for ... : pass` loop that named
      # two functions and asserted nothing about either.
      #
      # `trainer` is NOT in yet, and that is a decision rather than an oversight: the same
      # measurement says 17 findings, and every one of them is in a file another session
      # currently has open. Widening onto somebody's work in flight makes CI red for them,
      # not for the tree. Register entry 123.
      - run: ruff check medos/medos tests viewer
      - name: pytest tests/unit viewer/tests trainer/tests --require-stack
        run: pytest tests/unit viewer/tests trainer/tests -v --require-stack

  # -----------------------------------------------------------------------------------
  # The real thing: the compose stack, then the integration and e2e suites strictly.
  # -----------------------------------------------------------------------------------
  stack:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      COMPOSE: docker compose -f medos/deploy/compose/docker-compose.yml
      # The conftest default is still a stale 127.0.0.1:55433 -- the exact port from the
      # first incident. Set it explicitly; under --require-stack a stale default is a red
      # run rather than 74 silent skips, but CI should not be relying on that.
      MEDOS_TEST_DATABASE_URL: postgresql://medos:medos@127.0.0.1:5432/medos
      # MEDOS_DICOMWEB_URL is deliberately NOT set. It used to be pinned here to
      # `http://127.0.0.1:8042/dicom-web`, which since register entry 70 would OVERRIDE a
      # correct default with the one address a conformant deployment cannot publish --
      # re-creating the defect in CI only. `tests/_support/stack.py` derives the Gateway's
      # tenant-scoped root from MEDOS_GATEWAY_URL and MEDOS_TENANT_ID, whose defaults
      # already match this compose file. Set it only to point at a DIFFERENT deployment.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Bring up the compose stack
        run: $COMPOSE up -d --build --wait --wait-timeout 600

      # `--wait` honours the healthchecks in docker-compose.yml, which are
      # container-side. These four probes are HOST-side and are what the test suite
      # actually uses, which is not the same claim: a service can be healthy inside the
      # network and unpublished outside it.
      #
      # `curl -fsS` is NOT enough and this step used to use it. The OHIF origin is an
      # nginx with an SPA fallback: it answers `200 text/html` for every path it does not
      # recognise, including `/dicom-web/studies`. A curl that only checks the status
      # therefore reports a healthy PACS for an origin that has no PACS behind it, which
      # is the same class of mistake as the port that no longer existed. The probes in
      # `tests/_support/stack.py` check the SHAPE of each response, so this step runs
      # them rather than re-implementing a weaker version in shell.
      - name: Wait for the host-facing endpoints (shape-checked)
        run: |
          python - <<'PY'
          import sys, time
          sys.path.insert(0, ".")
          from tests._support import stack

          deadline = time.time() + 300
          pending = sorted(stack.PROBES)
          while pending and time.time() < deadline:
              still = []
              for key in pending:
                  ready, detail = stack.probe(key)
                  print(f"{'ok  ' if ready else 'wait'} {key}: {detail[:160]}", flush=True)
                  if not ready:
                      still.append(key)
              pending = still
              if pending:
                  time.sleep(5)
          for key in pending:
              print(f"::error::{key} never became ready: {stack.probe(key)[1][:400]}")
          sys.exit(1 if pending else 0)
          PY

      # tests/e2e declares the whole deployment in SUITE_DEPENDENCIES, so this line is
      # what turns a dead medos-gateway / worker / minio / triton into a red run.
      - name: pytest tests/integration tests/e2e --require-stack
        run: pytest tests/integration tests/e2e -v --require-stack

      # THE TWO `spikes/week0/test_contracts.py` STEPS ARE GONE, AND SO IS THE SPIKE.
      #
      # They ran as a SCRIPT rather than under pytest -- `pytest` on that file reports "no
      # tests ran" -- and reported `32/32 passed` into an uploaded JSON artifact. Eight of
      # MOS-IMG-010's eleven rejection codes were exercised there and nowhere else, which
      # is not a thing a coverage number or a collection error can say about a script
      # invoked by path. They are `tests/unit/test_geometry_contract.py` now, collected by
      # the `pytest tests/unit` step above, with a census that fails when a member of the
      # closed enum has no fixture.
      #
      # They had also been broken since `medos/` became a product directory: the spike did
      # `sys.path.insert(0, parents[2])` to reach `medos.core`, and `medos` moved down to
      # `medos/medos/`. Both steps were dying at ModuleNotFoundError, and nothing else
      # would have said so.

      - name: Compose logs (on failure)
        if: failure()
        run: $COMPOSE logs --tail 200

      - name: Tear down
        if: always()
        run: $COMPOSE down -v

  # -----------------------------------------------------------------------------------
  # Nightly, on the runner that has F:/WorkSpace/PulmoAI/TCIA (or its Linux equivalent)
  # mounted. This is the ONLY job that sets --require-corpus: it is the only one where an
  # absent corpus means the machine is misconfigured rather than the data being private.
  #
  # Two switches and not one. Conflating them is what makes people turn the whole thing
  # off: a contributor without the corpus would otherwise have to drop --require-stack as
  # well, and with it every guarantee this file exists to provide.
  # -----------------------------------------------------------------------------------
  nightly-corpus:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, lctsc-corpus]
    timeout-minutes: 180
    env:
      COMPOSE: docker compose -f medos/deploy/compose/docker-compose.yml
      MEDOS_TEST_DATABASE_URL: postgresql://medos:medos@127.0.0.1:5432/medos
      MEDOS_REQUIRE_STACK: "1"
      MEDOS_REQUIRE_CORPUS: "1"
    steps:
      - uses: actions/checkout@v4
      - run: pip install -e ".[dev]"
      - run: $COMPOSE up -d --build --wait --wait-timeout 900
      # Both switches come from the environment here rather than the command line, to
      # show that either form works and so a manual re-run of this exact command on the
      # runner reproduces the job.
      #
      # `MEDOS_REQUIRE_STACK=1` with no flag on the line is the ONE shape that can fail
      # quietly: an unrecognised `--require-stack` is a pytest usage error (exit 4) and
      # impossible to miss, whereas an env var that nothing reads is silence. Read the
      # `mode:` line of the MedicalOS skip taxonomy block in this job's log to confirm it
      # says `--require-stack ON, --require-corpus ON` before believing a green run here.
      - run: pytest tests -v

      # THE FOUR CORPUS CHECKS THE SPIKE RAN HERE ARE NOT REPLACED, and this file should
      # not hide that. `run_corpus_test` compared an RTSTRUCT lung against the threshold
      # mask, checked that contours land on lung-density voxels, wrote a SEG+SR and
      # verified the IOD, and re-ran the write for byte-stability -- four checks against
      # the real LCTSC tree, which only this runner has. Register entry 118 carries what
      # was lost and what porting them would take. The `pytest tests -v` step above still
      # runs everything under `tests/` against the corpus.

      - name: Tear down
        if: always()
        run: $COMPOSE down -v
