# =====================================================================================
# not_permissions -- section 8.3.2's closing paragraph, as data.
#
# "Spellings that appear in other chapters' prose and are **not** permission identifiers
# -- a build referencing any of them MUST fail under MOS-SEC-033."
#
# `in_use` marks the ones this repository enforces anyway. Both instances are chapter 6
# routes served through chapter 10's paths, and both are recorded in
# docs/spec/99-known-inconsistencies.md entry 5 ("Twenty-one routes in chapter 10 are
# bound to identifiers chapter 8 says are not permissions"). They are named here and NOT
# quietly corrected: re-pointing them is chapter 10's change and the register already
# owns its resolution.
#
# `named_in_8_3_2: false` marks a spelling the paragraph does NOT name and which is a
# non-permission only by omission from the catalogue -- MOS-SEC-033 denies it either
# way. Two of them exist, and register entry 5 asserts the paragraph names them; it
# does not. `medos/tools/permcheck.py` asserts the flag both ways, so neither a spelling that
# gets named nor one that stops being named can rot here.
# =====================================================================================
not_permissions:
  tenant.write:
    use: tenant.update
    named_in_8_3_2: false
    note: "bound by table 10.2-A and table 10.2-B rows 2 and 4; unregistered, so MOS-SEC-033 denies it."
    register_entry: "docs/spec/99-known-inconsistencies.md entry 5"
  user.write:
    use: user.update
    named_in_8_3_2: false
    note: "bound by table 10.2-A and table 10.2-B rows 6 and 9; unregistered, so MOS-SEC-033 denies it."
    register_entry: "docs/spec/99-known-inconsistencies.md entry 5"
  job.requeue:
    use: job.retry
    note: "ch. 5 T13, MOS-EXEC-012. The transition is real; the spelling is not."
  deployment.write:
    use: deployment.create / deployment.update / deployment.promote / deployment.suspend / deployment.retire
    note: "a coarsening. MOS-SEC-037a: the five verbs are not interchangeable."
  deployment.delete:
    use: deployment.suspend / deployment.retire
    note: "MOS-SEC-037a: there is no deletion path for a Deployment. It is permanent provenance."
  model.write:
    use: model.create / model.update
    note: "a coarsening of the model catalogue's write verbs."
    in_use:
      - "medos/medos/api/routes_registry.py PERMISSIONS and _KIND_WRITE (POST /api/v1/model-versions)"
      - "tests/integration/test_artifacts.py"
    register_entry: "docs/spec/99-known-inconsistencies.md entry 5"
  dataset.write:
    use: dataset.create / dataset.update / dataset_version.create
    note: "a coarsening spanning two resources with different classes (write vs phi)."
  validation.read:
    use: validation_report.read
    note: "an invention; the resource is ValidationReport."
  validation.approve:
    use: validation_report.approve
    note: "an invention; the resource is ValidationReport."
  service.write:
    use: service.update
    note: "a coarsening."
  service.publish:
    use: service_version.publish
    note: "a Service is not published; one of its versions is."
    in_use:
      - "medos/medos/api/routes_registry.py PERMISSIONS and _KIND_WRITE (POST /api/v1/service-versions)"
    register_entry: "docs/spec/99-known-inconsistencies.md entry 5"
  webhook.write:
    use: webhook.create / webhook.update / webhook.delete
    note: "a coarsening."
  result.review:
    use: result.review.read / result.review.submit / result.review.assign / result.review.reopen
    note: "the bare two-segment form is not a grant; MOS-SEC-031 admits the four three-segment rows."
  service.approve:
    use: service_version.approve
    note: "ch. 2 MOS-SVC-106 approves a version, not a service."
  result.publish:
    use: result.submit
    note: "a PEP id (section 8.4.1), not a permission. ch. 17 MOS-TRAIN-009 uses it as one."

# =====================================================================================
# unregistered_in_use -- THE DEFECT REGISTER. NOT GRANTS.
#
# Every key below is an identifier this repository passes to a permission check, and
# which section 8.3.2 registers nowhere. Under MOS-SEC-033 each one is unknown and MUST
# deny -- so each entry names an act that, on a platform with a working policy decision
# point, no principal can perform. They are recorded rather than registered because
# chapter 8 owns permission spellings (MOS-SEC-032) and this change owns only the rows
# section 8.3.2 needs for the training surface; inventing four more would be this file
# originating a spelling, which is the one thing it must never do.
#
# `medos/tools/permcheck.py` asserts this block is EXACTLY the set of enforced identifiers that
# are not catalogue keys and not `not_permissions` keys: an entry that gets registered
# must be deleted from here, and a new unregistered identifier cannot be added to the
# code without landing here first.
# =====================================================================================
unregistered_in_use:
  evidence.run:
    required_by:
      - "ch. 6 MOS-REG-021 -- the permission column for REGISTERED -> VALIDATING and VALIDATING -> VALIDATED"
      - "ch. 17 MOS-TRAIN-139 -- the pipeline service account MUST hold artifact.publish and evidence.run"
      - "ch. 14 MOS-TEST-087 -- AT-24 asserts the pipeline holds it"
    enforced_at:
      - "medos/medos/registry/lifecycle.py TRANSITION_PERMISSION and permission_for()"
      - "medos/medos/api/routes_registry.py PERMISSIONS (POST /api/v1/{service,model}-versions/{id}/status)"
      - "medos/medos/training/candidate.py PIPELINE_PERMISSIONS"
    registered_alternative: "evaluation.run (class write) is 8.3.2's evaluation verb; MOS-SEC-158 maps 'submit an evaluation' onto it"
    consequence: "denies under MOS-SEC-033. Four lifecycle edges -- VALIDATING, VALIDATED, SEALED, DEFECTIVE -- are unreachable by any principal."
    register_entry: "none. This one is NOT in docs/spec/99-known-inconsistencies.md; entry 16 covers chapter 17's MOS-TRAIN-009 set and does not reach MOS-REG-021's column."
  evidence.report.issue:
    required_by:
      - "ch. 17 MOS-TRAIN-151, MOS-TRAIN-173, MOS-TRAIN-174, MOS-TRAIN-232 -- promotion act A1"
      - "ch. 16 OQ text on separation of duties"
    enforced_at:
      - "medos/medos/training/orchestrator.py FORBIDDEN_PERMISSIONS"
      - "medos/medos/training/candidate.py FORBIDDEN_PIPELINE_PERMISSIONS"
    registered_alternative: "validation_report.create / validation_report.approve"
    consequence: "denies under MOS-SEC-033. Here it appears only in FORBIDDEN lists, where an unregistered spelling is a check that can never fire -- a principal cannot hold what cannot be granted, so the exclusion is vacuous rather than wrong."
    register_entry: "docs/spec/99-known-inconsistencies.md entry 16; ch. 19 MOS-UI-325 also forbids shipping the string."
  phi.admin:
    required_by:
      - "ch. 3 MOS-DATA-024 -- quarantined instances are invisible to every principal except one holding phi.admin"
    enforced_at:
      - "medos/medos/gateway/app.py (quarantine visibility, twice)"
      - "medos/medos/gateway/projection.py (QIDO-RS exclusion)"
    registered_alternative: "none. 8.3.2's phi rows are phi.reidentify, phi.erase and phi.policy_update; none of them means 'see quarantine'."
    consequence: "denies under MOS-SEC-033, so the gate denies everyone -- which is the safe direction and is why it has not surfaced as a defect."
    register_entry: "docs/spec/12-data-model.md records it verbatim as a cross-chapter defect rather than rendering it into a grant."
