# =====================================================================================
# medos/contracts/permissions.yaml -- the ONE source file MOS-SEC-032 requires.
#
#   MOS-SEC-032  "The permission list MUST be generated from one source file,
#                `medos/contracts/permissions.yaml`, into: Go constants, the Cedar action
#                schema, the OpenAPI security scheme descriptions, and the seed-role
#                migration. CI MUST fail if any generated file differs from a fresh
#                generation. Every `permission:` value in `medos/api/v1/routes.{core,train}.yaml`
#                (MOS-API-085) MUST be a key present in this file."
#   MOS-SEC-031  the identifier grammar: `^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*){1,2}$`.
#                Four or more segments is a build error.
#   MOS-SEC-033  a permission absent from this file is unknown and MUST deny.
#
# `permissions:` below carries one key per row of the catalogue in docs/spec/08-security.md
# section 8.3.2 and no others, which is chapter 8's acceptance check 5 stated as a file.
# Chapter 8 is the only source of permission spellings; this file is that chapter in the
# form a build can read, and `medos/tools/permcheck.py` refuses any divergence in either
# direction -- identifier, grants prose or class.
#
# WHAT THIS FILE GENERATES TODAY, AND WHAT IT DOES NOT. READ THIS BEFORE TRUSTING IT.
# -----------------------------------------------------------------------------------
# MOS-SEC-032 names four generated targets. This repository can produce exactly one of
# them, and a source of truth that silently generates nothing is a source of truth in
# name only -- so the other three are recorded here rather than implied:
#
#   PRODUCED
#     medos/contracts/permissions.generated.json
#       Written by `python medos/tools/permcheck.py --emit`. A stdlib-`json`-readable catalogue
#       for the Python consumers that exist. `medos/medos/security/scopes.py` states in its own
#       docstring that it cannot perform the MOS-SEC-033 resolution because "the generated
#       permission catalogue (MOS-SEC-032)" does not exist; this file is that input. The
#       wiring of `scopes.py` to it is a later change and is deliberately NOT done here.
#       `tests/unit/test_permission_contract.py` fails if the committed JSON differs from
#       a fresh generation, which is MOS-SEC-032's CI clause for the one target that has
#       a consumer.
#
#   NOT PRODUCED, and why -- each is a separate, larger change
#     Go constants
#       There is no Go control plane in this repository. `MOS-REL-084` schedules it for
#       weeks 3-5; `internal/api/` and `cmd/apigen` (MOS-API-086) do not exist.
#     Cedar action schema
#       There are no Cedar policies. Section 8.4's policy engine is unbuilt: no PolicySet
#       artifact (MOS-SEC-062), no PDP, no `policy_activations` rows.
#     OpenAPI security scheme descriptions
#       `docs/api/openapi.yaml` does not exist. MOS-API-087 forbids authoring it by hand,
#       so it can only arrive with the generator of MOS-API-086.
#     Seed-role migration
#       There is no `roles`, `role_permissions` or `user_roles` table. 0004_auth.up.sql
#       created `api_keys` and stopped; 0010_safety.up.sql records the absence in its own
#       header. Without those tables the seeded roles of section 8.3.4 and the pipeline
#       role of MOS-SEC-158 have nowhere to be seeded, and a migration generated into an
#       empty schema would assert a boundary that does not exist.
#
# SHAPE
#   permissions:          the catalogue. One key per 8.3.2 row; `grants` and `class`
#                         verbatim from that row.
#   not_permissions:      the spellings 8.3.2's closing paragraph registers as NOT
#                         permissions, each with the registered form to use instead.
#                         Present because MOS-SEC-033 makes using one a build failure and
#                         a reader who cannot find `service.publish` here needs to be told
#                         what to write, not left to guess.
#   unregistered_in_use:  identifiers this repository enforces that section 8.3.2
#                         registers nowhere. Every one of them DENIES under MOS-SEC-033.
#                         This block is a defect register, not a grant list, and nothing
#                         may read it as one; `medos/tools/permcheck.py` asserts that no key of
#                         it is a key of `permissions:`.
# =====================================================================================

version: 1

