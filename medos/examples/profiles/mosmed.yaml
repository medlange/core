# Medlange Core — example of an external deployment in the MosMed AI style
# (mode: external): a task arrives as a Kafka message, the result leaves as one.
#
# The topic/field scheme is an EXAMPLE of an external system, not a contract:
# substitute your own integration's dictionary (the inbound/outbound/error topics
# and the field mapping).
version: 1

card: /srv/medlange/models/lung-segmentation   # directory containing modelcard.json

pacs:
  kind: dicomweb
  base_url: "https://pacs.example.org/dicomweb/00000000-0000-0000-0000-000000000000"
  token_env: MEDOS_PACS_TOKEN                  # secret — from the environment, not from the file

inference:
  kind: kserve_v2
  url: "http://triton:8010"

select_series: ct_only

writer:
  kind: platform

mode: external
external:
  bus:
    kind: kafka
    bootstrap_servers: "kafka:9092"
    group_id: medlange-core
  inbound:
    topic: KAFKA-MESSAGE
    fields:
      studyInstanceUid: study_uid
      messageId: task_id
  outbound:
    topic: DICOMREPORTNOTIFY
    template:
      type: DICOMREPORTNOTIFY
      studyIUID: "{study_uid}"
      taskId: "{task_id}"
      aiResult: "{ai_result}"
  error:
    topic: PUMCONSUMERERROR
    template:
      type: PUMCONSUMERERROR
