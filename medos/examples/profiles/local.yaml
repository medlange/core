# Medlange Core — example of a local-deployment profile (mode: local).
#
# What it does: takes the listed studies from the PACS, runs them through the
# model, stores the results (SEG/SR) back into the archive via the platform writer.
# The values below are the compose stack's localhost defaults; substitute your own.
version: 1

# Directory containing modelcard.json (the trainer's model card) or the string
# 'selftest' for a smoke run of the SDK without a model.
card: selftest

pacs:
  kind: dicomweb
  base_url: "http://127.0.0.1:8043/dicomweb/00000000-0000-0000-0000-000000000000"
  token: "medos-dev-worker-key"

inference:
  kind: kserve_v2
  url: "http://127.0.0.1:8010"        # Triton (inference profile) or another KServe v2
  model_version: null

# Which series to process: ct_only (the pipeline default, C5) or image_only
# (explicit opt-in: all image modalities, without derived SEG/SR/RTSTRUCT).
select_series: ct_only

writer:
  kind: platform
  clinical_use_mode: "RESEARCH_ONLY"

mode: local
local:
  studies:
    - "1.2.276.0.7230010.3.1.2.249089308.7716.1675666133.12999"
