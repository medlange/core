  # ---------------------------------------------------------------------------------
  - operation_id: listResultReviews
    method: GET
    path: /result-reviews
    summary: List reviews
    permission: result.review.read
    idempotency: not_applicable
    status: served
    table_row: "67"
    responses:
      "200":
        schema: Page<ResultReview>
    problems: [cross-tenant-denied, rate-limited]

  - operation_id: claimResultReview
    method: POST
    path: /result-reviews/{result_review_id}/claim
    summary: PENDING to IN_REVIEW
    permission: result.review.submit
    idempotency: optional
    status: served
    table_row: "68"
    request:
      media_type: application/json
      schema: null
    responses:
      "200":
