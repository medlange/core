    problems: [not-found, cross-tenant-denied]

  - operation_id: getModelVersionImpact
    method: GET
    path: /model-versions/{model_version_id}/impact
    summary: Jobs, results and SeriesInstanceUIDs a recalled model version produced
    permission: model.read
    idempotency: not_applicable
    status: served
    table_row: null
    defined_by: MOS-REG-040
    responses:
      "200":
        schema: RecallImpact
    problems: [not-found, cross-tenant-denied]

  - operation_id: setModelVersionStatus
    method: POST
    path: /model-versions/{model_version_id}/status
    summary: Move a model version through the lifecycle graph
    permission: artifact.status.set
    permission_by_transition:
      REGISTERED: artifact.publish
      VALIDATING: evidence.run
      VALIDATED: evidence.run
      APPROVED: artifact.approve
      DEPRECATED: artifact.status.set
      SUSPENDED: artifact.suspend
      RECALLED: artifact.recall
    idempotency: optional
    status: served
    table_row: null
    defined_by: MOS-REG-021
    request:
      media_type: application/json
      schema: ArtifactStatusRequest
    responses:
      "200":
        schema: ModelVersion
    problems: [schema-violation, lifecycle-transition-forbidden, not-found, cross-tenant-denied]

  - operation_id: patchModelVersion
    method: PATCH
    path: /model-versions/{model_version_id}
    summary: Refused; a published manifest is immutable
    permission: null
    authn_only: true
