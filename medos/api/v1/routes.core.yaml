    problems: [not-found, cross-tenant-denied]

  - operation_id: getModelVersionAttestation
    method: GET
    path: /model-versions/{model_version_id}/attestation
    summary: Image digest, signature, SBOM reference for a model version
    permission: model.read
    idempotency: not_applicable
    status: served
    table_row: null
    defined_by: MOS-REG-084
    responses:
