    problems: [method-not-allowed]

  # ---------------------------------------------------------------------------------
  # Jobs. Table 10.2-B rows 55, 57, 58 and 60, served by medos/medos/api/routes_jobs.py and
  # medos/medos/api/routes_events.py.
  #
  # REPORTED, NOT RESOLVED HERE: neither module performs a permission check. The
  # authentication middleware of medos/medos/api/auth.py binds the tenant and refuses an
  # unauthenticated caller, so these routes are authenticated and tenant-isolated, but
  # `job.create` and `job.read` are declared below AND ENFORCED, as of the change that
  # added medos/medos/api/authz.py. They were declared and enforced nowhere until then, and
  # tests/gate/test_declared_permissions_are_enforced.py is what keeps the two in step:
  # it derives the claim from this file and checks the handler. MOS-API-089
  # closes exactly this gap by registering each handler together with the `permission`
  # value from its row -- which is the generator of MOS-API-086, and is why the
  # declaration belongs here even though today it binds nothing.
  # ---------------------------------------------------------------------------------
  # ---------------------------------------------------------------------------------
  # Chapter 10 table 10.2-B row 7. AUTHN ONLY, and that is the table's word, not a gap:
  # requiring a permission to discover your own permissions is a loop -- a credential with
  # an empty scope could not learn that its scope is empty, and the surface would render an
  # authenticated blank screen with nothing to explain itself. AuthenticationMiddleware
  # still applies, so there is no anonymous access here.
  #
  # `permission: null` here therefore means "the table says none", NOT "nobody got round to
  # it". The same is true of patchModelVersion and patchServiceVersion, for a different
  # stated reason -- both serve 405 unconditionally and read nothing, so there is no
  # permission to declare. All three carry `authn_only: true` to say so in the data rather
  # than only in a comment; this one did not until the contract test asked.
  # ---------------------------------------------------------------------------------
  - operation_id: getCurrentPrincipal
    method: GET
    path: /users/me
    summary: Identity and effective permissions of the caller
    permission: null
    authn_only: true
    status: served
    table_row: "7"
    responses:
      "200":
        schema: Principal
    problems: [unauthenticated]

  - operation_id: createJob
    method: POST
    path: /jobs
    summary: Create a job
    permission: job.create
    enforced_in_code: true
    idempotency: required
    status: served
    table_row: "55"
    request:
      media_type: application/json
      schema: JobCreateRequest
    responses:
      "202":
        schema: Job
        headers: [Location, Retry-After, MedicalOS-Idempotency-Key]
    problems: [schema-violation, idempotency-key-conflict, rate-limited, cross-tenant-denied]

  - operation_id: getJob
