      A cancel of an already-terminal run raises medos.training.runs.TrainingError, which
      carries no problem_type, so chapter 10 has no slug for that conflict and the change
      that serves this row owes one -- it is not listed below, because listing a slug
      nothing can raise is the shape of declaration this file exists to refuse.
    request:
      media_type: application/json
      schema: null
    responses:
      "200":
        schema: TrainingRun
