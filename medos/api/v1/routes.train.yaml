  # ---------------------------------------------------------------------------------
  # The corpus-assembly surface. Table 10.2-B rows R18-R31, plus entries for the two
  # existing rows 32 and 37 that this surface reads.
  #
  # WHY THESE ROWS EXIST. `POST /api/v1/training-runs` (R6) takes a dataset_version_id,
  # a split_id and an annotation_set_id, and until this change NOT ONE OF THE THREE HAD A
  # PRODUCER ON /api/v1. `declare_sampling_plan`, the curation queue, `seal_from_batch`,
  # `freeze_split` and `freeze_annotation_set` appeared in no chapter's route table, so
  # the served surface began one step after the operator's first step ended. Register
  # entry 79 named the run side of this and understated it: the missing half was upstream.
  #
  # ALL SIXTEEN ARE NOW `status: served`, BY `medos/medos/api/routes_curation.py`. They were
  # declared `reserved` by the change that wrote this block and served by the next one;
  # `status:` is checked in both directions against the running ASGI app
  # (`medos/tools/permcheck.py`), so the flip was not optional bookkeeping -- mounting a handler
  # without it is a red run, and flipping without a handler is a red run too.
  #
  # WHAT IS STILL NOT SERVED, AND IS THE REMAINING GAP: `MOS-API-112`'s R1-R5. A browser
  # can now declare a plan, read the batch and its queue, preview the split, seal, poll,
  # read the frozen split and freeze the reference standard -- and it still cannot OPEN a
  # batch or DECIDE a candidate, because that requirement says those five paths "MUST NOT
  # be served" and this file does not grant a licence chapter 10 withholds.
  #
  # THE ONE DESIGN DECISION, AND IT IS THE SEAL. Rows R26 and R27 are `202` + `Location`
  # + poll, the general long-running-operation pattern of MOS-API-056, driven through the
  # `Orchestrator` port of MOS-TRAIN-122. Three shapes were available:
  #
  #   SYNCHRONOUS -- REFUSED TWICE OVER. MOS-EVID-018's `series_pixel_digest` is a digest
  #     over STORED pixel values "computed by the caller that holds the pixels"
  #     (medos/medos/evidence/manifest.py: this module never opens a DICOM file) and
  #     MOS-EVID-034 L4's `dhash64` is a hash of the normalised mid-axial slice. Both
  #     oblige the seal to retrieve every instance of every series through the Gateway as
  #     `dataset_export` (MOS-TRAIN-068, MOS-TRAIN-199), and MOS-TRAIN-114's floor of 30
  #     `test` patients puts the smallest sealable cohort near 150. Minutes. The arithmetic
  #     is not the binding reason: MOS-UI-134 requires L3 and L4 to run "as a named,
  #     progress-reported step with the cohort size shown, never as a silent wait", and a
  #     synchronous POST has nowhere to report progress from. A socket that is either open
  #     or closed also cannot tell the operator whether a DatasetVersion was created --
  #     the state MOS-UI-132 forbids leaving them in.
  #   A `Job` -- REFUSED, AND MOS-API-001 IS THE REASON THE ENTITY EXISTS RATHER THAN AN
  #     OBSTACLE TO IT. "POST /api/v1/jobs is the only endpoint that may create a Job. No
  #     other path in the system may create a Job." Chapter 17 forbids it independently and
  #     more strongly: MOS-TRAIN-121 C3 excludes `job.create` from the orchestrator account
  #     outright, C2 forbids the pipeline appearing between a Job and its Result, C4
  #     requires a total orchestrator outage to change the outcome of no Job at all. A seal
  #     that created a Job would need a grant the pipeline identity MUST NOT hold.
  #   THE ORCHESTRATOR, POLLED -- TAKEN. MOS-API-056 already names a long-running operation
  #     that is not a Job: `EvaluationRun`, row 42. MOS-API-057 fixes the polling hint at
  #     `Retry-After: 30`. MOS-TRAIN-122's four methods -- Submit, Poll, Cancel, Logs --
  #     are the shape R26 and R27 render, and MOS-API-112's sentence that "until then the
  #     pipeline is driven through its own offline orchestrator, not through /api/v1" is
  #     the state these two rows are written to end.
  #
  # AND THE THIRD OPTION -- DECLARING THE PIXEL-DEPENDENT CHECKS SKIPPED -- IS WHAT THIS
  # DEPLOYMENT WILL ACTUALLY DO, WHICH IS WHY THE RESPONSE MAKES IT UNHIDEABLE.
  # `medos/medos/evidence/repo.py::load_records` returns `dhash64` as None for every rehydrated
  # record and says so in its own docstring; no adapter in this platform computes either
  # pixel-derived quantity today. MOS-EVID-037 already rules that L4 then reports `skipped`
  # with an explicit reason rather than `pass`, and that is legitimate. The danger is not
  # the skip; it is a cohort sealed without near-duplicate detection being presented to a
  # no-code operator as SEALED and read by them as CHECKED. So `schemas/evidence/
  # seal-run-1.0.0.json` makes the disclosure structural rather than editorial:
  #   - `check_battery` carries exactly nine entries, one per row of MOS-UI-133's table,
  #     and no entry may be omitted -- a missing check is not a pass;
  #   - `outcome` is closed at pass / fail / warn / skipped;
  #   - a `skipped` entry MUST carry a `skipped_reason` (>= 20 chars) AND an
  #     `operator_disclosure` (>= 40 chars) written in MOS-UI-105's register;
  #   - an entry whose `outcome` is `pass` MUST report `series_without_pixel_evidence: 0`.
  # A handler that retrieved no pixels therefore CANNOT emit a schema-valid SealRun
  # claiming L3 or L4 passed. MOS-UI-144's "the console MUST show the skip rather than a
  # pass" becomes a property of the response instead of an instruction to the browser.
  # Only the `pass` direction is constrained: a `fail` found among the series that WERE
  # hashed is a real finding, and forcing it to `skipped` would hide a genuine leak.
  #
  # THREE ABSENCES ACROSS THIS BLOCK, EACH A RULE AND NOT A GAP
  #   NO ROUTE FREEZES A SPLIT. MOS-UI-130 makes the seal one operator action spanning the
  #     DatasetVersion seal and the DatasetSplit freeze, and MOS-UI-132 makes it atomic from
  #     the operator's view. Independently: a freeze route would have to accept
  #     `assignments`, and a caller that names which patients are in `test` is
  #     MOS-TRAIN-141's "container that can name its own data" with an HTTP client in front
  #     of it. The server assigns by MOS-TRAIN-112's pure function and no request member
  #     anywhere in this block carries a partition, a fraction or a seed (MOS-EVID-028).
  #   NO ROUTE WRITES A WAIVER. MOS-UI-135, and MOS-TRAIN-115's reason that a waiver on L1,
  #     L2, L3 or L5 cannot permit a training run anyway.
  #   NO ROUTE CREATES A `Dataset`. Row 33 binds `dataset.write`, which section 8.3.2
  #     registers as a spelling a build MUST fail on and which MOS-UI-104 forbids this
  #     surface propagating; register entry 5 owns re-pointing it across twenty-one rows.
  #     Row 32 IS declared, so the operator selects a Dataset rather than composing its id
  #     (MOS-UI-101), and MOS-EVID-027's licence stays a legal act by the site -- the same
  #     posture MOS-UI-110 takes toward the TrainingDataPolicy.
  #
  # WHAT IS STILL MISSING AND IS NOT DECLARED HERE, because this file does not declare
  # routes in anticipation. MOS-UI-114 requires every FACET VALUE to display its patient
  # count before it is selected, and a value with zero matches to be shown as zero rather
  # than omitted -- "the difference between *this archive has no 0.6 mm studies* and *your
  # current filters exclude them* is the difference between two entirely different
  # remedies". No engine function computes facet-value patient counts over the archive;
  # row 70's study projection is the nearest existing surface and is not the same object.
  # A row for it would be a declaration that something exists when it does not.
  # ---------------------------------------------------------------------------------
  - operation_id: getTenantTrainingPolicy
    method: GET
    path: /tenants/{tenant_id}/training-policy
    summary: Whether this tenant's policy permits training use, and the instrument recorded
    permission: training_data_policy.read
    idempotency: not_applicable
    status: served
    table_row: R18
    defined_by: MOS-API-089
    entity_owner: MOS-TRAIN-073
    surface: training_console
    engine: medos.training.policy.live_policy
    note: >-
      The read half of R4, and the row R4 could not be. MOS-UI-110 requires the console's
      FIRST screen to render `training_use_allowed = false` under the refusal contract and
      forbids it rendering an HTTP status, a problem document or the string `403`; without
      this row the only way to learn the flag is to be refused by R1, so the console would
      have to render a refusal it is forbidden to render or infer one it cannot distinguish
      from a network fault. `surface:` IS set here and is deliberately absent on R4:
      MOS-UI-110 forbids the console editing the policy, and `training_data_policy.record` is
      `governance`, which MOS-UI-102 keeps off this surface. Reading is `read`. The two
      halves of one resource sit on different sides of that line and the registry says which.
    responses:
      "200":
        schema: TrainingDataPolicy
    problems: [not-found, cross-tenant-denied]

