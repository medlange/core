    note: >-
      MOS-API-005 admits exactly one permission and this row honestly needs two: MOS-UI-130
      makes it one action spanning `dataset_version.create` and `dataset_split.freeze`, and
      binding only the first would let a principal who may seal a version freeze a split they
      may not. `also_requires:` records the second; both are keys of
      medos/contracts/permissions.yaml, both are named in table 10.2-A, and widening MOS-API-005 to
      admit a conjunction is chapter 10's edit to its own prose. MOS-UI-104 is why the
      spelling is `dataset_version.create` and not row 38's `dataset.write`. The body is one
      member and the ABSENCES are the contract -- see
      schemas/evidence/seal-run-submit-request-1.0.0.json for each one and the requirement
      that removes it.
      THE THREE PIECES THIS ROW OWED, AND WHERE EACH ONE LANDED. `engine_absent:` on this
      entry named a missing `seal_runs` table, a missing MOS-TRAIN-112 `assign()` and a
      missing `dataset_export` retrieval adapter. The table is 0015_seal_runs.up.sql,
      `assign()` is medos/medos/training/split.py and the adapter is
      medos/medos/training/retrieval.py. THE THIRD ONE RETRIEVES NOTHING ON THIS DEPLOYMENT AND
      THAT IS NOT A GAP IN IT: medos/medos/gateway/app.py answers every retrieval whose consumer
      class is not `clinical_viewer` or `platform_writer` with 503 DEID_NOT_IMPLEMENTED,
      because the de-identification stage is unbuilt and MOS-DATA-037 requires the egress
      to fail closed rather than emit identified data -- and `dataset_export` is the only
      class MOS-TRAIN-068 permits the pipeline. So L3 and L4 report `skipped` with
      MOS-EVID-037's explicit reason and MOS-UI-105's operator disclosure, and the SealRun
      schema makes a `pass` unreachable while `series_without_pixel_evidence` is non-zero.
      Retrieving as `platform_writer` instead would succeed and would put IDENTIFIED
      pixels into a training corpus; the adapter does not hold that principal and MUST NOT
      acquire one.
    request:
      media_type: application/json
      schema: SealRunSubmitRequest
    responses:
