  - operation_id: sealHarvestBatch
    method: POST
    path: /harvest-batches/{harvest_batch_id}/seal
    summary: Seal -- one operator action, submitted and polled, never a Job
    permission: dataset_version.create
    also_requires: [dataset_split.freeze]
