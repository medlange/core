  # ---------------------------------------------------------------------------------
  # ConfigurationSearch. Table 10.2-B rows R13-R15. NOT A CONSOLE SURFACE.
  #
  # MOS-UI-150 forbids the no-code console launching a search, and the reason is worth
  # keeping in front of the implementer: a bounded budget, a declarative space and a
  # nomination are three decisions the operator has no basis for making, spending a
  # resource -- the `test` partition -- they cannot see being spent. `surface:` below says
  # `expert` for all three, and no console route may bind these permissions.
  #
  # They are declared anyway because MOS-TRAIN-213 catches ANY procedure producing more
  # than one trained artifact from one cohort and keeping a subset by a score computed on
  # data: an AutoRunner sweep, an nnU-Net configuration comparison, a learning-rate sweep,
  # a checkpoint-epoch choice, an ensemble-membership choice -- "whether or not the tool
  # that performed it calls itself AutoML" -- and MOS-TRAIN-218 requires every one to
  # produce a record. A platform that serves `TrainingRun` and not this invites the search
  # to be run outside the API and the record to be written afterwards, which is precisely
  # the tidier-looking and worse audit trail MOS-TRAIN-216 describes.
  #
  # NO LIST ROUTE, NO PATCH, NO DELETE, and each absence is a rule rather than a gap.
  # A list route is not declared because nothing needs one yet and this file does not
  # declare routes in anticipation. `PATCH` is not declared because MOS-TRAIN-234 says a
  # budget-terminated search that nominated none "MUST NOT be papered over by relaxing the
  # bound and resuming" and MOS-TRAIN-217 makes a later nomination a NEW row referencing
  # the original by `parent_search_id`, not an edit. `DELETE` is not declared because
  # 0013's `forbid_training_mutation` refuses it and MOS-TRAIN-217 requires non-nominated
  # trials to be retained with their digests so a re-nomination is auditable.
  # ---------------------------------------------------------------------------------
  - operation_id: declareConfigurationSearch
    method: POST
    path: /configuration-searches
    summary: Register a search with a digested declarative space and a bounded budget
    permission: configuration_search.declare
    idempotency: optional
    status: served
    table_row: R13
    defined_by: MOS-API-089
    entity_owner: MOS-TRAIN-218
    surface: expert
    engine: medos.training.search.create
    note: >-
      The verb is declare and not create. MOS-SEC-034 pairs a create permission with a
      removal disposition and names four never-deleted resources; configuration_searches is
      append-only under 0013 and would owe a fifth entry, which is chapter 8's edit. The
      domain's own word is registration -- MOS-TRAIN-220 refuses registration of a space
      that violates its grammar -- so no verb had to be invented to avoid create.
    request:
      media_type: application/json
      schema: ConfigurationSearchDeclareRequest
    responses:
      "201":
        schema: ConfigurationSearch
        headers: [Location]
    problems: [schema-violation, configuration-search-refused, cross-tenant-denied]

  - operation_id: getConfigurationSearch
    method: GET
    path: /configuration-searches/{configuration_search_id}
    summary: Read the search, its space, its budget, its cost and its nomination
    permission: configuration_search.read
    idempotency: not_applicable
    status: served
    table_row: R14
    defined_by: MOS-API-089
    entity_owner: MOS-TRAIN-218
    surface: expert
    engine: medos.training.search.get
    responses:
      "200":
        schema: ConfigurationSearch
    problems: [not-found, cross-tenant-denied]

  - operation_id: nominateConfigurationSearchTrial
