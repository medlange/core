    surface: training_console
    engine: medos.evidence.repo.list_datasets
    note: >-
      An EXISTING row of table 10.2-B, not a new one, and the first of the 81 unrouted rows
      this file has ever carried an entry for. Declared because R26 requires a dataset_id and
      MOS-UI-101 forbids the operator composing one. Its sibling row 33 (POST /datasets) is
      NOT declared: it binds `dataset.write`, which section 8.3.2 registers as a spelling a
      build MUST fail on and MOS-UI-104 forbids this surface propagating. So a Dataset -- one
      source, one licence (MOS-EVID-027) -- is recorded by whoever records the site's legal
      instruments, on the same footing as the TrainingDataPolicy of MOS-UI-110, and this
      surface selects among them.
