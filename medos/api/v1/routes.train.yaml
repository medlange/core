      answers 503 and names the gap; what it never does is freeze a set over zero cases,
      because MOS-EVID-046 makes every EvaluationRun citing such a set fail and minting
      one because the store is missing is the quiet downgrade this surface exists against.
    request:
      media_type: application/json
      schema: AnnotationSetFreezeRequest
    responses:
      "201":
        schema: AnnotationSet
        headers: [Location]
    problems: [schema-violation, split-freeze-refused, deployment-not-declared, not-found, cross-tenant-denied]

