# =====================================================================================
# medos/api/v1/routes.train.yaml -- the model-preparation service's route registry.
#
# ONE OF TWO. `medos/api/v1/routes.core.yaml` carries the PACS-and-models service's. See that
# file's header for why they are separate; briefly, `medos/tools/permcheck.py` checks each
# against its own app, and one registry could only ever be right about one of them.
#
# THIS FILE CARRIES THE SCHEMAS AND THE PROBLEM TYPES -- all of them -- because all of
# them were the training surface's: 34 schemas, 7 `api_problem_types` every one of
# which is minted by `medos/medos/api/routes_curation.py`, and 8 `training_problem_types`.
# Core referenced none.
#
# `minted_by` still names files under `medos/medos/api/`, and `medos/tools/permcheck.py` still
# requires that. The two routers live there because moving them into `medos/medos/training/`
# would open the promotion edge `MOS-TRAIN-189` keeps closed; the argument is in
# `medos/medos/api/training_plane.py`.
# =====================================================================================

version: v1

# -------------------------------------------------------------------------------------
# Schema name -> file. MOS-API-084 makes `schemas/` the single source of truth for every
# request body, response body, event payload and problem extension, one file per type
# with an absolute `$id` under https://spec.medicalos.org/schemas/v1/. Only the training
# surface has its files written; `schemas_pending` is every other name this file uses.
# The index is explicit rather than derived from the name, because a resolution rule
# that guesses a path silently resolves to nothing when the guess is wrong.
# -------------------------------------------------------------------------------------

schemas:
  HarvestBatchCreateRequest: schemas/training/harvest-batch-create-request-1.0.0.json
  HarvestBatch: schemas/training/harvest-batch-1.0.0.json
  CurationDecisionRequest: schemas/training/curation-decision-request-1.0.0.json
  CurationDecision: schemas/training/curation-decision-1.0.0.json
  TrainingDataPolicyPutRequest: schemas/training/training-data-policy-put-request-1.0.0.json
  TrainingDataPolicy: schemas/training/training-data-policy-1.0.0.json
  CorpusStratificationReport: schemas/training/corpus-stratification-report-1.0.0.json
  TrainingRunSubmitRequest: schemas/training/training-run-submit-request-1.0.0.json
  TrainingRun: schemas/training/training-run-1.0.0.json
  Page<TrainingRun>: schemas/training/page-training-run-1.0.0.json
  CapabilitySeedVariance: schemas/training/capability-seed-variance-1.0.0.json
  SplitTestExposure: schemas/training/split-test-exposure-1.0.0.json
  TrainingRunCandidate: schemas/training/training-run-candidate-1.0.0.json
  ConfigurationSearchDeclareRequest: schemas/training/configuration-search-declare-request-1.0.0.json
  ConfigurationSearch: schemas/training/configuration-search-1.0.0.json
  ConfigurationSearchNominationRequest: schemas/training/configuration-search-nomination-request-1.0.0.json
  ConversionRunSubmitRequest: schemas/training/conversion-run-submit-request-1.0.0.json
  ConversionRun: schemas/training/conversion-run-1.0.0.json
  # The corpus-assembly surface, rows R19-R31 and rows 32 and 37. `schemas/evidence/`
  # is a second directory rather than more files under `schemas/training/`, because
  # `DatasetVersion`, `DatasetSplit` and `AnnotationSet` are chapter 7 entities that the
  # training surface READS and does not own -- filing them under `training/` would put
  # chapter 7's wire contract in a directory chapter 17's changes edit.
  SamplingPlanDeclareRequest: schemas/training/sampling-plan-declare-request-1.0.0.json
  SamplingPlan: schemas/training/sampling-plan-1.0.0.json
  Page<SamplingPlan>: schemas/training/page-sampling-plan-1.0.0.json
  Page<HarvestBatch>: schemas/training/page-harvest-batch-1.0.0.json
  HarvestCandidate: schemas/training/harvest-candidate-1.0.0.json
  Page<HarvestCandidate>: schemas/training/page-harvest-candidate-1.0.0.json
  SplitPreview: schemas/training/split-preview-1.0.0.json
  SealRunSubmitRequest: schemas/evidence/seal-run-submit-request-1.0.0.json
  SealRun: schemas/evidence/seal-run-1.0.0.json
  DatasetSplit: schemas/evidence/dataset-split-1.0.0.json
  AnnotationSetFreezeRequest: schemas/evidence/annotation-set-freeze-request-1.0.0.json
  AnnotationSet: schemas/evidence/annotation-set-1.0.0.json
  Page<AnnotationSet>: schemas/evidence/page-annotation-set-1.0.0.json
  Dataset: schemas/evidence/dataset-1.0.0.json
  Page<Dataset>: schemas/evidence/page-dataset-1.0.0.json
  DatasetVersion: schemas/evidence/dataset-version-1.0.0.json

# Names used below that `schemas/` does not yet carry. MOS-API-084 requires a file for
# every one of them; writing thirty schemas for the existing surface is not this change.
# The list is asserted to be EXACTLY the set of unresolved names, so it cannot rot.

schemas_pending:
  - ArtifactStatusRequest
  - Attestation
  - EventEnvelope
  - Job
  - JobCreateRequest
  - ModelVersion
  - ModelVersionCreateRequest
  - Page<ModelVersion>
  - Page<ResultReview>
  - Page<ServiceVersion>
  # `GET /users/me` responds with this and no file has been written for it yet. Listed
  # here rather than left out, because the gate's whole subject is that the index and the
  # pending list together account for every name the registry uses -- a name in neither is
  # a response shape nothing in the repository describes.
  - Principal
  - RecallImpact
  - ResultReview
  - ResultReviewAssignRequest
  - ResultReviewReopenRequest
  - ResultReviewSubmitRequest
  - SeriesSelection
  - ServiceVersion
  - ServiceVersionCreateRequest

# Four of those names are minted here because no chapter names them: table 10.2-B writes
# the bodies as literal objects (`{assignee_user_id}`, `{action_rationale}`) and chapter 6
# section 6.11 writes the status body as a literal example. A type needs a name before it
# can have a file, and an unnamed body is a body nobody generates.

minted_schema_names:
  - ArtifactStatusRequest
  - RecallImpact
  - ResultReviewAssignRequest
  - ResultReviewReopenRequest

# =====================================================================================
# training_problem_types -- the `problems:` slugs the training rows name, against what
# `medos.sdk/errors.py` ACTUALLY RAISES. READ THIS BEFORE IMPLEMENTING A HANDLER.
#
# The slugs below are not decoration: they are what a conforming client matches on
# (`MOS-API-035` makes `type` the stable identifier), and on this surface the
# specification and the only implementation disagree about two of the three parts of
# every one of them. Both divergences are PLATFORM-WIDE, both are recorded, and this
# change resolves NEITHER -- it records what the code does, which is the half a client
# sees, and leaves the decision to the one change that can take it for all thirteen
# problem types at once.
#
#   1. THE AUTHORITY. docs/spec/99-known-inconsistencies.md entry 80: the code spells
#      twelve types `https://medicalos.dev/problems/...` and one `spec.medicalos.org`;
#      the specification spells fifteen `spec.medicalos.org` and two `medicalos.dev`.
#      `MOS-API-036` names `https://spec.medicalos.org/problems/` as the ONLY permitted
#      prefix and `medos/medos/api/problems.py` carries it as `PROBLEM_BASE` -- and
#      `medos.sdk/errors.py` does not go through that constant. `MOS-API-112` fixed
#      one binding in advance (`training-use-not-permitted`) and
#      `schemas/training/training-use-not-permitted-1.0.0.json` pins it as a `const`, so
#      that one refusal is now written down twice in agreement with each other and not
#      with the running system. Changing one constant makes the code internally
#      inconsistent instead of externally; changing twelve is a breaking change to the
#      wire contract of every refusal this platform emits. Entry 80 owns it.
#   2. THE `class`. Table 10.4-A is closed at six values (`MOS-API-038`) and
#      `medos/medos/api/problems.py WIRE_CLASSES` carries them. `HarvestRefused` and
#      `PartitionForbidden` render `class: authorization`, WHICH IS NOT ONE OF THE SIX;
#      the registered spelling is `authz_error` and `MOS-API-112` pins it for
#      `training-use-not-permitted`. The other three render `clinical_rejection`, which
#      is `medos.sdk/refusal.py`'s default and is the reading CONTRACT.md section 9
#      argues for -- a refused run is information the caller must act on, not a broken
#      platform -- but `MOS-API-039` gives `clinical_rejection` a distinct affordance for
#      a CLINICIAN, and whether a leaking split belongs in that register is the same
#      one-decision question as (1). Not taken here.
#
# `raised_by` is asserted by importing the class, so this block cannot rot away from the
# module: see `tests/unit/test_permission_contract.py`.
#
# A THIRD FINDING, RECORDED BY THE CHANGE THAT DECLARED R1-R5 AND CLOSED BY THE CHANGE
# THAT SERVED THEM. Two slugs those rows named were not problem types and nothing could
# raise them: `curation-decision-already-settled` (row R3) and `training-policy-required`
# (row R4). Each is now settled, and differently, because they were wrong in different
# ways.
#
#   `curation-decision-already-settled` IS A REAL TYPE NOW, and it always could have been:
#     `medos/medos/api/problems.py::problem_type_uri` derives `type` MECHANICALLY from `code`
#     ("one mapping rather than a hand-maintained table, because a table is how `type` and
#     `code` drift apart"), so a handler answering 409 with code
#     `CURATION_DECISION_ALREADY_SETTLED` emits exactly that slug. It is declared below in
#     `api_problem_types`, together with the four other slugs `medos/medos/api/routes_curation.py`
#     mints the same way, and `medos/tools/permcheck.py` recomputes each one from its `code` --
#     so the block cannot drift from the handler any more than the handler can drift from
#     `problem_type_uri`.
#   `training-policy-required` IS NOT A TYPE AND ROW R4 NO LONGER NAMES IT. It is the name
#     of the DEFERRABLE INITIALLY DEFERRED constraint trigger in 0011_curation.up.sql and
#     section 12.10 -- a database object. The trigger still fires at COMMIT and the
#     handler catches it there; what reaches the wire is MOS-TRAIN-073's refusal, whose
#     type is `training-use-not-permitted` because `HarvestRefused` raises it. R4 names
#     that instead.
#
# `surface:` IS NOW SET on R1, R2, R3 and R5, which pulls their slugs under the check
# above -- which is the point. It stays off R4: MOS-UI-110 forbids the console editing the
# policy and MOS-UI-102 excludes the `governance` class the row's permission carries.

# The problem types `medos/medos/api/` MINTS rather than raises, on the rows above that carry a
# `surface:`. `training_problem_types` records what a refusal CLASS raises and is checked
# by importing the class; these have no class -- they are `build_problem(code=...)` calls,
# and `problem_type_uri` makes the slug a pure function of the code. So the check is the
# same discipline by a different route: `medos/tools/permcheck.py` recomputes
# `problem_type_uri(code)` for every entry here and fails when it is not this slug. A row
# carrying a `surface:` may name a slug from this block, from `training_problem_types` or
# from `SHARED_PROBLEMS`, and nothing else.

api_problem_types:
  sampling-plan-capability-mismatch:
    code: SAMPLING_PLAN_CAPABILITY_MISMATCH
    status: 409
    class: client_error
    minted_by: medos/medos/api/routes_curation.py::open_harvest_batch
    why: >-
      MOS-TRAIN-083 makes the SamplingPlan the description of the draw, so a plan declared
      for another capability describes nothing about this batch.
  training-policy-not-live:
    code: TRAINING_POLICY_NOT_LIVE
    status: 409
    class: client_error
    minted_by: medos/medos/api/routes_curation.py::open_harvest_batch
    why: >-
      The batch records the LIVE instrument so MOS-TRAIN-076 can say which candidates
      predate a revocation. A caller that could name a revoked one could produce a batch
      whose provenance says it predates its own revocation.
  curation-decision-not-found:
    code: CURATION_DECISION_NOT_FOUND
    status: 404
    class: client_error
    minted_by: medos/medos/api/routes_curation.py::get_curation_decision
    why: >-
      Distinct from `not-found` on the CANDIDATE, because the remedies differ: one is a
      wrong id and the other is a queue item nobody has reached. MOS-TRAIN-080 forbids
      auto-inclusion, so undecided is backlog and never 200 with a null decision.
  curation-decision-already-settled:
    code: CURATION_DECISION_ALREADY_SETTLED
    status: 409
    class: client_error
    minted_by: medos/medos/api/routes_curation.py::record_curation_decision
    why: >-
      `curation_decisions_settled_uk` is UNIQUE (candidate_id) WHERE decision <> 'defer'
      and MOS-TRAIN-203 keeps the row. A second decision is a conflict, never an edit.
  training-policy-already-live:
    code: TRAINING_POLICY_ALREADY_LIVE
    status: 409
    class: client_error
    minted_by: medos/medos/api/routes_curation.py::put_training_policy
    why: >-
      The row's terms are sealed after insert (MOS-TRAIN-073), so a PUT whose terms differ
      from the live instrument is a withdrawal plus a new instrument and not a replace.
      A PUT whose terms MATCH is a no-op and answers 200, which is what makes the method
      idempotent in fact rather than in the registry.
  corpus-stratification-report-not-found:
    code: CORPUS_STRATIFICATION_REPORT_NOT_FOUND
    status: 404
    class: client_error
    minted_by: medos/medos/api/routes_curation.py::get_harvest_batch_stratification
    why: >-
      A batch still being curated has not been through the C1-C7 battery. A body saying
      `verdict: null` would read to a no-code operator as a cohort that passed nothing in
      particular rather than one nobody has looked at -- the confusion MOS-API-112 fixes
      structurally for SealRun.check_battery.
  deployment-not-declared:
    code: DEPLOYMENT_NOT_DECLARED
    status: 503
    class: system_failure
    minted_by: medos/medos/api/routes_curation.py::_deployment_problem
    why: >-
      MOS-UI-160 separates a refusal the operator caused from one the deployment caused.
      Nothing in the request body makes a deployment that never declared MEDOS_TENANT_SALT
      able to compute MOS-EVID-010's patient_key. `retryable: false` is passed explicitly
      because the default class for 503 carries `retryable: true`, which would be a lie.
# =====================================================================================

training_problem_types:
  training-use-not-permitted:
    raised_by: medos.sdk.errors.HarvestRefused
    type_as_raised: https://medicalos.dev/problems/training-use-not-permitted
    type_as_specified: https://spec.medicalos.org/problems/training-use-not-permitted
    status: 403
    class_as_raised: authorization
    class_as_specified: authz_error
    register_entry: "docs/spec/99-known-inconsistencies.md entry 80"
  training-run-refused:
    raised_by: medos.sdk.errors.RunRefused
    type_as_raised: https://medicalos.dev/problems/training-run-refused
    type_as_specified: null
    status: 422
    class_as_raised: clinical_rejection
    class_as_specified: null
    note: >-
      MOS-UI-158's `Refused` category, and the reason it is never a `FAILED` row: the
      leakage re-execution of MOS-TRAIN-115, the incomplete binding of MOS-TRAIN-124 and
      the missing rationale of MOS-TRAIN-211 all refuse at submit, before the first batch
      is loaded, so the operator sees a 422 in the console and no run is created.
  configuration-search-refused:
    raised_by: medos.sdk.errors.SearchRefused
    type_as_raised: https://medicalos.dev/problems/configuration-search-refused
    type_as_specified: null
    status: 422
    class_as_raised: clinical_rejection
    class_as_specified: null
  conversion-refused:
    raised_by: medos.sdk.errors.ConversionRefused
    type_as_raised: https://medicalos.dev/problems/conversion-refused
    type_as_specified: null
    status: 422
    class_as_raised: clinical_rejection
    class_as_specified: null
  curation-refused:
    raised_by: medos.sdk.errors.CurationRefused
    type_as_raised: https://medicalos.dev/problems/curation-refused
    type_as_specified: null
    status: 422
    class_as_raised: clinical_rejection
    class_as_specified: null
    note: >-
      Everything medos/medos/training/curation.py refuses with. Row R3's slug
      `curation-decision-already-settled` is a `code` INSIDE one of these documents and not a
      `type`, which the block below this one has recorded since the row was written; that row
      is now one edit from correct and the edit belongs to the change that serves R1-R5, not
      to this one.
  dataset-seal-refused:
    raised_by: medos.sdk.refusal.SealRefused
    type_as_raised: https://medicalos.dev/problems/dataset-seal-refused
    type_as_specified: null
    status: 422
    class_as_raised: clinical_rejection
    class_as_specified: null
    note: >-
      Chapter 7's seal refusing, as distinct from chapter 17's curation refusing. Row R26
      names both, because MOS-UI-130 makes the seal one operator action spanning two platform
      operations and MOS-UI-105's `what would fix it` differs between them: a blocking C-check
      is fixed by changing the cohort, and a manifest-level refusal is not.
  split-freeze-refused:
    raised_by: medos.sdk.refusal.FreezeRefused
    type_as_raised: https://medicalos.dev/problems/split-freeze-refused
    type_as_specified: null
    status: 422
    class_as_raised: clinical_rejection
    class_as_specified: null
    note: >-
      A FINDING, RECORDED AND NOT FIXED HERE. `FreezeRefused` is raised by BOTH
      `medos/medos/evidence/repo.py::freeze_split` and `::freeze_annotation_set`, so an
      AnnotationSet refused for a missing `consensus_params` renders `type:
      .../split-freeze-refused`. MOS-API-035 makes `type` the stable identifier a conforming
      client matches on, so the slug is wrong for half of what raises it. Splitting the class
      is a breaking change to a wire `type` and is the same one-decision question as register
      entry 80; row R29 names the slug the code actually emits rather than the one it should,
      because this file records what the code does.
  partition-not-readable:
    raised_by: medos.sdk.errors.PartitionForbidden
    type_as_raised: https://medicalos.dev/problems/partition-not-readable
    type_as_specified: null
    status: 403
    class_as_raised: authorization
    class_as_specified: authz_error
    note: >-
      MOS-TRAIN-141 fixes the status and the reason for it -- 403, not an empty set, because
      an empty set is indistinguishable from "no such patient" and a retry loop around one
      is how a silent read becomes a routine one. No row below lists this slug: no declared
      route takes a partition name, which is the structural form of the same rule. It is
      recorded because a handler that reaches medos.training.cohort.resolve() can raise it
      and would otherwise render it as an unhandled 500.

coverage:
  # Counted over THIS file, against `medos.api.training_plane:create_training_app`.
  # `served_entries` was 61 across the single registry and is 33 here; the other 29
  # are in routes.core.yaml (28 at the split, plus `GET /users/me`). The table 10.2-B
  # numbers below were unchanged by the split, because every one of them was already a
  # statement about the model-preparation surface -- but `GET /users/me` carries table row
  # 7, so serving it does move one row out of the debt. See the note.
  served_entries: 33
  reserved_entries: 0
  table_10_2_b_served_rows: 101
  table_10_2_b_reserved_rows: 31
  table_10_2_b_rows_without_an_entry: 78
  routes_served_by_medos_api_without_an_entry: 0
  note: >-
    78 = 101 served rows minus the 23 that have an entry here. The other 8 entries render
    chapter 6 section 6.11 routes that table 10.2-B does not carry, which is why 28 - 20
    is not zero and why the two counts are kept apart. `table_10_2_b_rows_without_an_entry`
    is UNCHANGED by the change that served R18-R31: those fourteen are table 10.2-B
    RESERVED rows and rows 32 and 37 already had entries, so serving them moves no row
    out of the debt. That is the honest arithmetic and it is worth saying plainly -- the
    surface got substantially larger and MOS-API-085's shortfall did not shrink by one.
    `GET /users/me` is the first change since that did: it carries table row 7, which had
    no entry before, so the count above went 79 -> 78. One row, and it is the difference
    between the debt being static and the debt being worked down.
    served_entries rises from 56 to 61 and reserved_entries falls from 5 to ZERO: the
    twelve R6-R17 rows served by medos/medos/api/routes_training.py, the fourteen R18-R31 rows
    and the two existing rows 32 and 37 served by medos/medos/api/routes_curation.py, the
    28 that were served before, and now MOS-API-112's R1-R5 in that same module. A table
    10.2-B row's RESERVED/SERVED classification stays chapter 10's and `status:` stays
    this deployment's; conflating the two would make the debt look smaller than it is,
    which is why `table_10_2_b_reserved_rows` still counts every R-row and did not move.
    NOTHING IN THIS FILE IS RESERVED ANY MORE, and that is the whole of the R-series: a
    browser can now record the policy, declare the plan, open the batch, read and decide
    the queue, read the stratification report, preview the split, seal, poll, freeze the
    split and the reference standard, and submit a training run. Every number here is
    recomputed from the files and from the running ASGI app by
    tests/unit/test_permission_contract.py, so none of them can be improved by editing
    this block.
routes:
  # ---------------------------------------------------------------------------------
  # The training surface. Table 10.2-B rows R1-R5 -- MOS-API-112's five, SERVED since the
  # change that wrote `medos/medos/api/routes_curation.py`'s R1-R5 block.
  #
  # WHAT CHANGED, AND IT IS NOT A LICENCE ANYBODY GRANTED THEMSELVES. These five carried
  # `status: reserved` on a sentence that read "MUST NOT be served until a handler is
  # registered", which forbids serving them until they are served, and cited MOS-API-089,
  # which carries no reservation clause at all. docs/spec/99-known-inconsistencies.md
  # entry 88 records the circularity and MOS-API-112 as amended states the correction in
  # terms: "these five are unserved because no handler exists, and the change that
  # registers one against the `permission:` value of its own row serves them." The three
  # preconditions that requirement DID set were discharged by 5cb96fb -- a row in table
  # 10.2-B, a schema in `schemas/`, a catalogue key in medos/contracts/permissions.yaml -- and
  # this block adds nothing to them but the handler.
  #
  # `surface:` IS SET ON R1, R2, R3 AND R5 AND IS DELIBERATELY ABSENT ON R4. The four are
  # the console's own screens: the cohort draw of 19.3.2, the curation queue of 19.3.3 and
  # the composition panel MOS-UI-116 requires to come from the server. R4 is not, and
  # MOS-UI-110 is why -- the console MUST NOT offer a screen that edits the policy,
  # because "the assertion it records is the site's legal one, not this operator's" --
  # and `training_data_policy.record` is a `governance`-class key, which MOS-UI-102
  # excludes from the surface outright. A `surface:` on R4 would say the opposite of both.
  #
  # MOS-API-022 enumerates the rows on which `Idempotency-Key` is REQUIRED -- 15, 29,
  # 36, 38, 42, 46, 51, 55, 62, 68b, 71a -- and does not reach R1 or R3. Both stay
  # `optional`, which is MOS-API-022's default for an unsafe method, and a handler MUST
  # NOT enforce a rule chapter 10 has not written: answering 400 IDEMPOTENCY_KEY_REQUIRED
  # here would break a conforming client. WHAT THE HANDLERS NOW DO HONOUR is that
  # requirement's second sentence, which is a MUST and reaches every unsafe method --
  # "when absent the server MUST generate one and MUST echo it in
  # `MedicalOS-Idempotency-Key`" -- on R1 and R3 and on R19, R26 and R29, which had been
  # serving without it. Making the key REQUIRED on the two creating rows is an edit to
  # MOS-API-022's enumeration, which chapter 10 owns; the residual exposure is that R1 can
  # open two batches from two deliveries of one request, and an echoed key is not a
  # remembered one. R3 cannot double-decide (`curation_decisions_settled_uk` answers 409)
  # and R4 is a PUT whose second identical call is a no-op by construction.
  # ---------------------------------------------------------------------------------
  - operation_id: openHarvestBatch
    method: POST
    path: /harvest-batches
    summary: Open a harvest batch against a sealed sampling plan and draw its candidates
    permission: harvest_batch.open
    idempotency: optional
    status: served
    surface: training_console
    table_row: R1
    defined_by: MOS-API-112
    entity_owner: MOS-TRAIN-078
    engine: medos.training.curation.open_batch
    engine_also: medos.training.curation.add_candidate
    request:
      media_type: application/json
      schema: HarvestBatchCreateRequest
    responses:
      "201":
        schema: HarvestBatch
        headers: [Location, MedicalOS-Idempotency-Key]
    problems: [schema-violation, training-use-not-permitted, curation-refused, deployment-not-declared, sampling-plan-capability-mismatch, training-policy-not-live, not-found, cross-tenant-denied, rate-limited]
    note: >-
      The draw is the SERVER's and reads `result_provenance`, which is the only table in
      this platform holding MOS-TRAIN-084's acquisition_profile "copied from the source
      header without imputation". Two consequences are named in
      medos/medos/api/routes_curation.py's THE DRAW section and neither is fixable from chapter
      10: every candidate it produces has `ran_on_platform = true`, which is a stratum
      MOS-TRAIN-083 requires a plan to declare and this draw can give only one value of;
      and `score_band` collapses, because `result_provenance.operating_threshold` is NULL
      on every row this platform has written. A draw that selects nothing is a 422
      `curation-refused` carrying per-reason COUNTS and no UID, not an empty 201 --
      HarvestBatch closes `additionalProperties` and has no member in which "and here is
      why nothing matched" could be said.

  - operation_id: getCurationDecision
    method: GET
    path: /harvest-candidates/{harvest_candidate_id}/decision
    summary: The settled curation decision on one candidate
    permission: harvest_candidate.read
    idempotency: not_applicable
    status: served
    surface: training_console
    table_row: R2
    defined_by: MOS-API-112
    entity_owner: MOS-TRAIN-079
    responses:
      "200":
        schema: CurationDecision
    problems: [not-found, curation-decision-not-found, cross-tenant-denied]
    note: >-
      Bound to `harvest_candidate.read` and not to a key of its own: reading the decision
      IS reading the candidate's curation state, and a second key would be a second place
      for the two to disagree. A candidate with no SETTLED decision answers 404 with its
      own code and never 200 with `decision: null` -- MOS-TRAIN-080 forbids auto-inclusion,
      so an undecided candidate is backlog, and a null a client could read as a value is
      the shape that rule exists to prevent. A deferral is not settled either
      (`curation_decisions_settled_uk` is UNIQUE (candidate_id) WHERE decision <> 'defer').

  - operation_id: recordCurationDecision
    method: POST
    path: /harvest-candidates/{harvest_candidate_id}/decision
    summary: Record a curation decision as the named human
    permission: curation_decision.record
    idempotency: optional
    status: served
    surface: training_console
    table_row: R3
    defined_by: MOS-API-112
    entity_owner: MOS-TRAIN-080
    engine: medos.training.curation.decide
    request:
      media_type: application/json
      schema: CurationDecisionRequest
    responses:
      "201":
        schema: CurationDecision
        headers: [Location, MedicalOS-Idempotency-Key]
    problems: [schema-violation, curation-decision-already-settled, curation-refused, training-use-not-permitted, not-found]
    note: >-
      ONE candidate per request, addressed by the path, and the body carries no array of
      any kind. That is MOS-UI-119 made structural: the console MUST NOT offer a select
      all and include control "that writes decisions without the cases having been
      shown", and a `decisions[]` member would be that control with an HTTP client in
      front of it. `decided_by` is not a body member either -- MOS-TRAIN-080's named human
      is the authenticated principal. There is no route to
      `medos.training.curation.auto_exclude`: MOS-TRAIN-205 requires the predicate's
      serialised SOURCE with it, and a predicate a client supplies is a human judgement
      represented as if it had one.

  - operation_id: putTenantTrainingPolicy
    method: PUT
    path: /tenants/{tenant_id}/training-policy
    summary: Record the tenant's TrainingDataPolicy and set training_use_allowed
    permission: training_data_policy.record
    idempotency: not_applicable
    status: served
    table_row: R4
    defined_by: MOS-API-112
    entity_owner: MOS-TRAIN-073
    engine: medos.training.policy.record_policy
    engine_also: medos.training.policy.set_training_use_allowed
    request:
      media_type: application/json
      schema: TrainingDataPolicyPutRequest
    responses:
      "200":
        schema: TrainingDataPolicy
    problems: [schema-violation, training-use-not-permitted, training-policy-already-live, not-found, cross-tenant-denied]
    note: >-
      NO `surface:`, and that absence is MOS-UI-110 and MOS-UI-102 together. This is the
      one `governance`-class key the training rows bind, deliberately off the console.
      `training-policy-required` was named here before a handler existed and is NOT a
      problem type: it is the name of the DEFERRABLE INITIALLY DEFERRED constraint trigger
      in 0011_curation.up.sql. The trigger still fires -- at COMMIT, which is why the
      handler catches the integrity error there -- and what travels on the wire is
      MOS-TRAIN-073's refusal, whose type is `training-use-not-permitted` because
      `medos.sdk.errors.HarvestRefused` raises it. Repointed here rather than left,
      which is one of the two things the `training_problem_types` block said this change
      owed. `idempotency: not_applicable` because PUT is idempotent by METHOD, and the
      handler makes that true rather than assuming it: a repeat of the same terms sets the
      flag and returns the live row, and terms that DIFFER are 409, because the row's
      sealing trigger forbids editing them and a correction is a withdrawal plus a new
      instrument, by two people who each meant it.

  - operation_id: getHarvestBatchStratification
    method: GET
    path: /harvest-batches/{harvest_batch_id}/stratification
    summary: The corpus stratification report recorded on a batch
    permission: corpus_stratification_report.read
    idempotency: not_applicable
    status: served
    surface: training_console
    table_row: R5
    defined_by: MOS-API-112
    entity_owner: MOS-TRAIN-088
    responses:
      "200":
        schema: CorpusStratificationReport
    problems: [not-found, corpus-stratification-report-not-found, cross-tenant-denied]
    schema_divergence: >-
      A FINDING AGAINST THE SCHEMA, NOT AGAINST THE HANDLER, AND NOT PAPERED OVER.
      `schemas/training/corpus-stratification-report-1.0.0.json` types every check's
      `observed` and `bound` as `number` and closes the check object at
      {statistic, observed, bound, outcome, waiver?}. `medos/medos/evidence/stratification.py`
      emits an OBJECT for C4 -- {distinct, p90_over_p10} against {min_distinct,
      max_p90_over_p10} -- and `null` for C5 where no thin-slice subset applies, and it
      also emits `id` and `detail` on every check and a fifth `outcome` value, `waived`.
      The handler carries `observed` and `bound` through EXACTLY as computed, because
      MOS-TRAIN-088 asks for "the full result and not the verdict" and a reader cannot see
      a margin in a number invented to fit a type; it drops `id` (the key carries it),
      drops `detail` (no member exists), and projects `waived` as `warn` WITH the
      MOS-TRAIN-091 waiver object attached, which is what that requirement's "MUST NOT
      block" and "MUST be reproduced in full" together say. So C4 -- and C5 when it is
      n/a -- do not satisfy this row's own schema. Widening the schema is chapter 10's and
      chapter 17's; tests/integration/test_api_curation.py pins the divergence by name so
      that fixing it turns red.

  # ---------------------------------------------------------------------------------
  # The training-run surface. Table 10.2-B rows R6-R12, discharging chapter 19 sections
  # 19.3.5 (Train), 19.3.6 (Evaluate) and 19.3.7 (Promote).
  #
  # WHY THESE ROWS EXIST AT ALL. docs/spec/99-known-inconsistencies.md entry 79: chapter
  # 19 specifies the Train screen exhaustively and names no endpoint; chapter 17 owns
  # `TrainingRun`, the `Orchestrator` port and the three-act promotion AS ENTITIES;
  # chapter 10 carried nothing -- a search of 10-api.md for training-runs returned 0.
  # MOS-API-112's four reserved paths cover 19.3.2 and 19.3.4 and stop there, so a console
  # built on them could assemble and seal a dataset and then not start a run. Entry 79
  # names what is needed -- rows for `TrainingRun`, `ConfigurationSearch`, `ConversionRun`
  # and the promotion surface, with the schemas and permissions MOS-API-112 established as
  # the precondition pattern -- and these twelve rows plus R13-R17 are that.
  #
  # THREE DECISIONS, ARGUED, BECAUSE EACH COULD REASONABLY HAVE GONE THE OTHER WAY
  # -------------------------------------------------------------------------------
  # 1. WHAT TRAIN IS. One unsafe route, `POST /training-runs`, with a four-member body.
  #    MOS-UI-147: "a single action with no configuration ... the cohort, the split, the
  #    reference standard and the target capability as a read-only summary, and one
  #    control." Those four are exactly the four ids the body carries. MOS-TRAIN-124
  #    requires the run to bind some twenty further inputs and EVERY ONE OF THEM IS
  #    SERVER-DERIVED, on one argument applied uniformly: a value a client may supply is a
  #    value a client may supply wrongly, and MOS-TRAIN-126's whole claim for the record is
  #    that these are "recorded rather than asserted" -- a client-supplied `hardware.gpu_model`
  #    is an assertion wearing a record's clothes, and it ends up in a `ValidationReport`.
  #    The two members that are NOT in the body are the load-bearing ones:
  #      `hyperparameters` -- MOS-TRAIN-224 puts the training batch size in it and
  #        MOS-UI-149 forbids revealing that quantity as editable, as a default, or behind
  #        an "advanced" region. With no such member and `additionalProperties: false`, a
  #        no-code client cannot reach any of MOS-UI-149's six quantities under any name.
  #        This is the difference between a screen that does not offer a control and an API
  #        on which the control does not exist.
  #      `fit_partition` / `select_partition` -- MOS-TRAIN-141's rule, on the wire. The
  #        cohort resolver "takes a split id and a partition name and nothing else", and
  #        `medos/medos/training/cohort.py reject_location_argument()` refuses a path, a bucket
  #        prefix and a glob for the stated reason that "a container that can name its own
  #        data can name the test partition". A request body that named a partition would
  #        be that container with an HTTP client in front of it.
  #    The ONE optional member is `training_backend`, and MOS-UI-148 is why it is optional
  #    rather than absent or enumerated-to-two. Absent: MOS-TRAIN-211 contemplates a
  #    hand-configured run as a legitimate expert act requiring a 20-character rationale,
  #    and a body with no backend member leaves that rule nowhere on the wire. Enumerated
  #    to `nnunet`/`auto3dseg`: the next client that needs a hand-configured run gets it by
  #    widening the enum, and the rationale rule is re-decided by whoever does that.
  #    Optional, with the `monai_supervised` / `backend_rationale` biconditional in the
  #    schema, satisfies MOS-UI-148 structurally -- the console omits the member and gets
  #    the auto-configuring backend the fingerprint chooses -- and makes a `monai_supervised`
  #    body without a rationale a 422 before a connection is opened. It is the same
  #    biconditional 0013 carries as `training_runs_rationale_only_when_hand_configured`.
  #
  # 2. WHETHER EVALUATE IS A PATH. IT IS NOT. 19.3.6 is titled "Evaluate -- automatic,
  #    against the locked test partition" and MOS-UI-162 says it "MUST be automatic on
  #    `state = SUCCEEDED`" and "MUST NOT be an action the operator initiates".
  #    MOS-TRAIN-138 registers the bundle and MOS-TRAIN-140 creates the candidate
  #    `EvaluationRun` on `partition: "test"` with the same `split_digest` and
  #    `annotation_digest` the run was fitted against -- both inside the pipeline, neither
  #    with a client. Row 42 (`POST /evaluations`) exists and is NOT this path: a second
  #    create route for the candidate run would be two ways to spend the one consumable
  #    MOS-TRAIN-216 counts, and MOS-UI-162 forbids the console offering a partition,
  #    cohort, metric or threshold chooser at all. So 19.3.6 gets zero action rows. What it
  #    gets is R11, because the counter MOS-TRAIN-216 requires the platform to maintain and
  #    MOS-UI-163 requires the console to display had no path in any chapter either.
  #
  # 3. WHAT 19.3.7 GETS. ONE READ, R12, AND NOTHING THAT ACTS. The full argument is in
  #    `schemas/training/training-run-candidate-1.0.0.json`; in short: MOS-UI-167 requires
  #    the promotion control to be ABSENT rather than disabled, MOS-TRAIN-003 says the
  #    pipeline MUST NOT BE CAPABLE of a state beyond `VALIDATED`, MOS-TRAIN-008 puts
  #    `VALIDATED -> APPROVED` in a named human's hands, and MOS-SEC-158 enforces that by
  #    the absence of the grant rather than by a check in code. An approval route here
  #    would be that grant, written down. A DOSSIER route was considered and rejected:
  #    MOS-TRAIN-011 requires the promotion decision to be made against the full evidence
  #    set and MOS-UI-170 puts the dossier in 19.5 on a different surface, under the
  #    separation of duties that keeps it there, saying in terms that 19.3.7 "adds no path
  #    to it". R12 is therefore a thin projection -- id, status, verdict, exposure count,
  #    and the name of the permission that decides -- with no link, no action and no
  #    deployment reference, because MOS-UI-168 requires the terminal state to be rendered
  #    and the deciding role NAMED, and a console that joined rows 30 and 43 itself would
  #    render a state no server asserted (MOS-UI-116's argument, one screen along).
  #
  # WHAT THE CHANGE THAT SERVES THESE ROWS MUST NOT DO, so that `no-auto-promote` stays
  # green (tests/gate/test_no_auto_promote.py):
  #   - it MUST NOT put a handler for any of these rows inside `medos/medos/training/`. Check 1
  #     asserts the import closure of `medos.training` reaches neither `medos.promotion`
  #     nor `medos.evidence.deployment`; a router that imports both the engine and the
  #     registry belongs in `medos/medos/api/`, where it already is for every other surface.
  #   - it MUST NOT put a scheduler, a watcher or an alert callback in the same module as
  #     `runs.submit`. Check 4 greps `medos/medos/` and `deploy/` for the ASSEMBLY -- a scheduler
  #     token and a training/promotion entrypoint token in one file -- because MOS-TRAIN-194
  #     forbids the four-component construction in which no individual component looks
  #     wrong. `crontab`, `APScheduler`, `celery`, `add_periodic_task`, `on_drift`,
  #     `on_alert`, `autoretrain` and `schedule.every` are the tokens it looks for.
  #   - it MUST NOT add a route that mutates a `Deployment` role or a `clinical_use_mode`.
  #     MOS-UI-170 extends MOS-TRAIN-189's call-graph property to the console.
  #
  # PERMISSION CLASSES. MOS-UI-102 requires every action the console offers to be
  # authorised by a permission of class `read`, `write` or `phi`, and forbids a screen, a
  # control or a code path requiring `governance` or `clinical`. Every permission bound by
  # R6-R12 is `read` or `write`, and none is in
  # `medos.training.orchestrator.FORBIDDEN_PERMISSIONS` or
  # `medos.training.candidate.FORBIDDEN_PIPELINE_PERMISSIONS`; both properties are asserted
  # in `tests/unit/test_permission_contract.py` against those imported tuples rather than
  # against a second copy of the list.
  #
  # AN OBLIGATION THIS CHANGE DOES NOT CLOSE, stated in MOS-API-112's own form. MOS-API-022
  # enumerates the rows on which `Idempotency-Key` is REQUIRED -- 15, 29, 36, 38, 42, 46,
  # 51, 55, 62, 68b, 71a -- and does not reach R6, R13 or R16, so three unsafe creating
  # endpoints stand with an optional key. Widening that enumeration is chapter 10's edit to
  # its own prose and not a row, so it is recorded here rather than assumed. The gap is
  # narrower on R6 than it was on R1 and R3: 0013's `UNIQUE (tenant_id, run_digest)` makes a
  # re-submission of the same binding a conflict rather than a second run, and MOS-TRAIN-124
  # is what makes that digest mean "the same experiment".
  #
  # A SECOND OBLIGATION, ON CHAPTER 8. MOS-UI-102 names the seeded `evidence_scientist` role
  # as the console's reference principal and requires CI to assert the union of the console's
  # route permissions is a subset of it plus the harvest and curation permissions. The eight
  # keys the run side registers are in none of section 8.3.4's seeded roles, so that subset
  # clause cannot hold until 8.3.4 carries them. Section 8.3.4 is not this change's to edit
  # -- this one owns 8.3.2's rows -- and there is no `roles` table to seed into either
  # (0004_auth.up.sql created `api_keys` and stopped). Recorded, not papered over.
  #
  # THE CORPUS-ASSEMBLY ROWS NARROW THAT SHORTFALL RATHER THAN WIDENING IT, and the split
  # is worth stating exactly. Seven of the eleven keys rows R18-R31 and rows 32 and 37 bind
  # -- `dataset.read`, `dataset_version.read`, `dataset_version.create`,
  # `dataset_split.read`, `dataset_split.freeze`, `annotation_set.read`,
  # `annotation_set.create` -- are ALREADY inside `evidence_scientist` as MOS-UI-102 spells
  # it (`dataset.*`, `dataset_version.*`, `dataset_split.read/freeze`, `annotation_set.*`),
  # so the whole seal and annotation surface is inside the reference principal without
  # section 8.3.4 changing at all. The four outside it are `training_data_policy.read`,
  # `sampling_plan.read`, `sampling_plan.declare` and `harvest_batch.read`, and they are
  # the same KIND of key as the harvest and curation permissions MOS-UI-102's clause already
  # adds to the role by name -- which is an argument for amending that clause, and chapter
  # 19 owns it.
  # ---------------------------------------------------------------------------------
  - operation_id: submitTrainingRun
    method: POST
    path: /training-runs
    summary: Train -- one action, over a sealed cohort and a frozen split
    permission: training_run.submit
    idempotency: optional
    status: served
    table_row: R6
    defined_by: MOS-API-089
    entity_owner: MOS-TRAIN-124
    surface: training_console
    engine: medos.training.runs.submit
    note: >-
      MOS-UI-151 requires the console to re-verify and display the preconditions the job
      will itself enforce -- L1, L2, L3 and L5 against the frozen manifest, the test
      partition floor, the seeded-annotation ceilings and code_dirty = false -- so that a
      refusal arrives in the console rather than as a dead run. medos.training.runs.submit
      performs the leakage and binding checks and refuses with training-run-refused; the
      handler adds no second copy of them.
    request:
      media_type: application/json
      schema: TrainingRunSubmitRequest
    responses:
      "202":
        schema: TrainingRun
        headers: [Location]
    problems: [schema-violation, training-run-refused, training-use-not-permitted, not-found, cross-tenant-denied, rate-limited]

