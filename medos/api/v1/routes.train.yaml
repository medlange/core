    problems: [cross-tenant-denied, rate-limited]

  - operation_id: getDatasetVersion
    method: GET
    path: /dataset-versions/{dataset_version_id}
    summary: Read the sealed cohort MOS-UI-147 renders as a read-only summary
    permission: dataset.read
    idempotency: not_applicable
    status: served
    table_row: "37"
    entity_owner: MOS-EVID-015
    surface: training_console
    engine: medos.evidence.repo.get_dataset_version
    note: >-
      An EXISTING row of table 10.2-B. Declared because MOS-UI-147 renders the cohort in the
      Train summary and a console that could see its cohort only through the SealRun that
      made it would lose the summary the next day. Rows 36, 38 and 40 are NOT declared, and
      the reason is worth recording: they describe a two-step model -- create an UNSEALED
      version, then seal it -- that this platform does not implement. `seal_dataset_version`
      mints the version already sealed from the records it is handed, so there is no unsealed
      version to create, to seal or to delete. Row R26 is the seal this deployment actually
      performs; the divergence between it and row 38 is chapter 10's to resolve.
    responses:
      "200":
        schema: DatasetVersion
    problems: [not-found, cross-tenant-denied]
